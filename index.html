<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock, Paper, Scissors</h1>
    <div id="content">
      <div class="button-container">
        <button class="choice-button" data-choice="rock">Rock</button>
        <button class="choice-button" data-choice="paper">Paper</button>
        <button class="choice-button" data-choice="scissors">Scissors</button>
      </div>
      <div id="result-display">
        <p id="round-display">Round 1</p>
        <p id="choices-display"></p>
        <p>
          Player <span id="player-score">0</span> -
          <span id="computer-score">0</span> Computer
        </p>
      </div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
